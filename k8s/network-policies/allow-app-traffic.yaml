kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-app-traffic
  namespace: win-apps
spec:
  podSelector:
    matchLabels:
      app: my-windows
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: my-windows
      ports:
        - protocol: TCP
          port: 8080